# Blueprint для Render: одним действием создаёт сервер API и базу Postgres.
# Сейчас выбраны БЕСПЛАТНЫЕ тарифы (для пробы). Подробности и ограничения: DEPLOY.md
#
# Чтобы перейти на платные и сохранить фото/голосовые между перезапусками, замените:
#   plan: free  ->  plan: starter  (у сервера)  и  plan: basic-256mb  (у базы)
# и добавьте под сервером диск и переменную (раскомментируйте строки ниже).
databases:
  - name: beervia-db
    databaseName: beervia
    user: beervia
    plan: free

services:
  - type: web
    name: beervia-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /health
    # disk:
    #   name: uploads
    #   mountPath: /data
    #   sizeGB: 2
    envVars:
      - key: NODE_ENV
        value: production
      # - key: UPLOADS_DIR
      #   value: /data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: beervia-db
          property: connectionString
