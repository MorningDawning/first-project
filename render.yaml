# Blueprint для Render: одним действием создаёт сервер API и базу Postgres.
# Подробная инструкция: DEPLOY.md
databases:
  - name: beervia-db
    databaseName: beervia
    user: beervia
    plan: basic-256mb

services:
  - type: web
    name: beervia-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    healthCheckPath: /health
    # Постоянный диск для фото и голосовых сообщений (без него файлы пропадают при обновлении сервера).
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: beervia-db
          property: connectionString
